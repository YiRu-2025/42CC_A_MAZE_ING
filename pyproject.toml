[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generator: perfect mazes and playable boards"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [{ name = "sluyu" }, { name = "yru" }]
keywords = ["maze", "generator", "42"]

[tool.setuptools]
packages = ["mazegen"]

[tool.mypy]
exclude = ["venv", "build", "dist"]
