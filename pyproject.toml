[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generator: perfect mazes and playable boards"
readme = "mazegen/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "sluyu" }, { name = "yru" }]
keywords = ["maze", "generator", "42"]

[tool.setuptools]
packages = ["mazegen"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
exclude = ["amaze-virtual", "venv", "build", "dist"]
